  backend: memory
  redis_url: redis://localhost:6379/0
  memcached_url: memcached://localhost:11211
  default_ttl_seconds: 3600
vector:
  backend: memory
  embeddings_backend: litellm
  embedding_model: text-embedding-004
  opensearch_url: http://localhost:9200
  qdrant_url: http://localhost:6333
database:
  backend: memory
  hot_url: sqlite+aiosqlite:///./data/hot_state.db
  cold_url: sqlite+aiosqlite:///./data/cold_state.db
pdf:
  backend: docling
eval:
  backend: local
  threshold: 0.8
observability:
  langfuse:
    enabled: false
    host: https://cloud.langfuse.com
  logfire:
    enabled: false
    service_name: training_coordinator
  otel_endpoint: null
adk:
  enabled: true
a2a:
  enabled: false
looker:
  enabled: false
  base_url: ''
bqml:
  enabled: false
  project: ''
  location: US
  dataset: ''
  model: ''
assets:
  enabled: false
  pack: core
gemini_enterprise:
  enabled: false
agent_cli:
  enabled: false
  framework: none
sdk_mcp:
  servers: []
security:
  secrets_backend: env
  content_guardrail_backend: passthrough
tenant:
  isolation_mode: logical
ingest:
  source: sharepoint
